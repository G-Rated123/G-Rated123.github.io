<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriDecaTron Gamepage</title>
    <link rel="stylesheet" href=tridecatron.css>
</head>
<body>
    <nav>

<!--header-->

        <div class="header">

            <!--title thing-->

            <a id="titleLink" href="tridecatron.html">
               <div id="title">
                   <h2>TriDecaTron</h2>
               </div>
            </a>

            <!--top buttons that lead to other pages-->

            <div class="top-buttons">
                <button id="homebutton"> <a href="index.html">Home</a> </button> 
                <button id="gamebutton"> <a href="tridecatron.html">TriDecaTron</a> </button>
                <button id="infobutton"> <a href="info.html">Info</a> </button>
            </div>

        </div>

        <hr>

    </nav>

<!--body box-->

    <div class="home-box">

    <!--game box-->

        <div class="game-box">

            <!--scores and points tracker-->

            <div class="scoreBoard">

                <div id="triesLeft">
                    <p>Tries left: 3</p>
                </div>

                <div id="score">
                    <p>Correct: 0</p>
                </div>

            </div>

            <!--text and image above wheels-->

            <div class="image-div">
                
                <div>
                   <h2>What is this image?</h2>
                </div>

                <div>
                   <p>Use the wheels to spell the word!</p>
                </div> 

                <div>
                   <p id="image">&#128204;</p>
                </div>

            </div>

            <!--wheels with the letters-->
            
            <div class="letter-wheels">
               <div id="wheelOne">
                   <p>Wheel 1</p>
                   <button class="up-button">▲</button>
                   <h1>b</h1>
                   <button class="down-button">▼</button>
               </div>

               <div id="wheelTwo">
                   <p>Wheel 2</p>
                   <button class="up-button">▲</button>
                   <h1>a</h1>
                   <button class="down-button">▼</button>
               </div>

               <div id="wheelThree">
                   <p>Wheel 3</p>
                   <button class="up-button">▲</button>
                   <h1>t</h1>
                   <button class="down-button">▼</button>
               </div>
            </div>

            <!--control buttons-->
            
            <div class="bottom-buttons">
                <p>When you're done, check your word!</p>
                <button>Check</button>
                <button>Reset</button>
                <button>Finish</button>
            </div>

        </div>

    </div>

    <script src="tridecatron.js"></script>

</body>
</html
