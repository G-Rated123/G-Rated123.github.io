<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriDecaTron Gamepage</title>
    <link rel="stylesheet" href=tridecatron.css>
</head>
<body>
    <nav>

<!--header-->

        <div class="header">

            <!--title-->

            <a id="titleLink" href="tridecatron.html">
               <div id="title">
                   <h2>TriDecaTron</h2>
               </div>
            </a>

            <!--top buttons that lead to other pages-->

            <div class="top-buttons">
                <button id="homebutton"> <a href="index.html">Home</a> </button> 
                <button id="gamebutton"> <a href="tridecatron.html">TriDecaTron</a> </button>
                <button id="infobutton"> <a href="info.html">Info</a> </button>
            </div>

        </div>

        <hr>

    </nav>

<!--body box-->

    <div class="home-box">

    <!--game box-->

        <div class="game-box">

            <!--text/gamebox title-->

               <div class="top-row">

                   <h2>What is this image?</h2>

               </div>

            <!--text and image above wheels-->

            <div class="image-div">

                <div>
                   <p class="instruction">Use the wheels to spell the word!</p>
                </div> 

                <div>
                   <p id="image"></p>
                </div>

                <p id="rightWrong"></p>

            </div>

            <!--wheels with the letters-->
            
            <div class="letter-wheels">
               <div id="wheelOne" data-letters="b,p,m,f,s,t,h,w,c,n">
                   <button class="up-button">▲</button>
                   <h1>b</h1>
                   <button class="down-button">▼</button>
               </div>

               <div id="wheelTwo" data-letters="a,o,u,i,e,ea,oo,ee,ai,ou">
                   <button class="up-button">▲</button>
                   <h1>a</h1>
                   <button class="down-button">▼</button>
               </div>

               <div id="wheelThree" data-letters="t,ll,n,d,r,g,nd,m,ng,w">
                   <button class="up-button">▲</button>
                   <h1>t</h1>
                   <button class="down-button">▼</button>
               </div>
            </div>

            <div>
                <p class="instruction">When you're done, check your word!</p>
            </div>

            <!--control buttons-->
            
            <div class="bottom-button">
                <button id="check">Check</button>
            </div>

        </div>

    </div>

    <script src="tridecatron.js"></script>

</body>
</html
